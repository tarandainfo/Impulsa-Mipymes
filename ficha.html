    <main>

        <section class="ficha-section">

                <a href="./index.html#mipymes" class="ficha-volver">
                    ← Volver a Mipymes
                </a>

                <!-- Encabezado de la mipyme: se completa con JS -->
                <div class="ficha-header" id="ficha-header"></div>

                <!-- Carrusel de fotos del producto -->
                <div class="carrusel" id="carrusel">

                    <div class="carrusel-track" id="carrusel-track"></div>

                    <button class="carrusel-flecha carrusel-flecha-izq" id="flecha-izq" aria-label="Foto anterior">
                        ‹
                    </button>

                    <button class="carrusel-flecha carrusel-flecha-der" id="flecha-der" aria-label="Foto siguiente">
                        ›
                    </button>

                    <div class="carrusel-puntos" id="carrusel-puntos"></div>

                </div>

                <!-- Descripción (2 párrafos) -->
                <div class="ficha-descripcion" id="ficha-descripcion"></div>

                <!-- Link a la nota periodística (se oculta si no tiene) -->
                <a href="#" id="ficha-nota" target="_blank" rel="noopener" class="ficha-nota-link">
                    Leer la nota completa →
                </a>

                <!-- Contacto -->
                <div class="ficha-contacto">

                    <h3>Contactar a esta Mipyme</h3>

                    <div class="mipyme-actions" id="ficha-actions"></div>

                </div>

            </div>

        </section>

    </main>
